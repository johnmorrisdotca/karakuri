<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Karakuri · puzzle game</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}karakuri-board{max-height:100%}</style></head><body><script type="module">
import "../dist/element-define.js";
import { KARAKURI_GAME_IDS, KARAKURI_GAMES } from "../dist/games.js";
const query=new URLSearchParams(location.search),board=document.createElement("karakuri-board"),game=KARAKURI_GAME_IDS.includes(query.get("game"))?query.get("game"):"tube-sort";board.setAttribute("game",game);board.setAttribute("size","medium");
for(const[name,choices]of[["theme",["auto","light","dark"]],["size",["small","medium","large"]],["lang",["en","ja"]],["ui",["full","board"]],["clock",["real","manual"]]])if(choices.includes(query.get(name)))board.setAttribute(name,query.get(name));
for(const[name,min,max]of[["width",100,2000],["level",1,KARAKURI_GAMES[game].levels],["keyboard-step",1,100]]){const value=query.get(name);if(value!==null&&/^\d+$/.test(value)&&Number(value)>=min&&Number(value)<=max)board.setAttribute(name,value);}
for(const name of["controls","keyboard"])if(query.has(name)&&["","true","on","1","false","off","no","0"].includes(query.get(name).trim().toLowerCase()))board.setAttribute(name,query.get(name));const label=query.get("label");if(label!==null&&label.length<=200)board.setAttribute("label",label);if(query.get("lang")==="ja")document.documentElement.lang="ja";
for(const type of["karakuri-load","karakuri-status","karakuri-change","karakuri-error"])board.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});document.body.append(board);
</script></body></html>
